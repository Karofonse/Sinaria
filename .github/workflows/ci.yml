name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, migraciones, pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sonaria
          POSTGRES_PASSWORD: sonaria_test
          POSTGRES_DB: sonaria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sonaria -d sonaria_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://sonaria:sonaria_test@127.0.0.1:5432/sonaria_test
      REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic
      - name: Migraciones contra base vacía
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Pruebas
        run: pytest

  web:
    name: Web (tipos, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
