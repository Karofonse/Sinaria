[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonaria-api"
version = "0.1.0"
description = "API de Sonaria: generación musical, créditos y biblioteca"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "pyjwt>=2.8",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B904: los errores HTTP dentro de except son intencionales (no filtrar detalles internos).
ignore = ["B008", "B904", "UP042", "E501"]  # E501: el formateador (ruff format) controla la longitud

[tool.setuptools]
packages = ["app", "app.core", "app.db", "app.domain", "app.providers", "app.routers", "app.storage"]
